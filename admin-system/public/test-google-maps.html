<!DOCTYPE html>
<html>
<head>
    <title>Google Maps API Test</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
            border: 2px solid #ccc;
        }
        .info {
            padding: 20px;
            background: #f0f0f0;
            margin: 20px;
            border-radius: 5px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>Google Maps API Diagnostic Test</h2>
        <p>API Key: <code>AIzaSyDXUjga_-ckxO6o1frZ-PuGL9XM_9tR6HY</code></p>
        <p id="status">Loading...</p>
    </div>
    
    <div id="map"></div>

    <script>
        function initMap() {
            try {
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 16.02, lng: 120.24 },
                    zoom: 12
                });
                
                new google.maps.Marker({
                    position: { lat: 16.02, lng: 120.24 },
                    map: map,
                    title: 'Test Marker'
                });
                
                document.getElementById('status').innerHTML = '<span class="success">✓ Google Maps loaded successfully!</span>';
            } catch (error) {
                document.getElementById('status').innerHTML = '<span class="error">✗ Error: ' + error.message + '</span>';
                console.error('Map initialization error:', error);
            }
        }

        function gm_authFailure() {
            document.getElementById('status').innerHTML = '<span class="error">✗ API Key Authentication Failed!</span><br>' +
                '<strong>Possible reasons:</strong><br>' +
                '1. API key is invalid or expired<br>' +
                '2. Billing not enabled on Google Cloud<br>' +
                '3. Required APIs not enabled (Maps JavaScript API, Places API, Geocoding API)<br>' +
                '4. API key restrictions blocking this domain';
        }

        window.gm_authFailure = gm_authFailure;
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDXUjga_-ckxO6o1frZ-PuGL9XM_9tR6HY&libraries=places&callback=initMap" async defer></script>
</body>
</html>

name: tourist_spot_app
description: A Flutter app for navigating tourist spots in the 2nd District of Pangasinan.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # UI & Navigation
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  
  # Location & Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.0
  map_launcher: ^4.4.0
  google_maps_flutter_web: ^0.6.1
  
  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  
  # BLoC Pattern (optional)
  flutter_bloc: ^8.1.0
  
  # DateTime
  intl: ^0.19.0
  
  # Loading & Animation
  shimmer: ^3.0.0
  lottie: ^2.6.0
  
  # Rating & Carousel
  flutter_rating_bar: ^4.0.1
  
  # Bottom sheets & Dialogs
  modal_bottom_sheet: ^2.1.2
  
  # Connectivity
  connectivity_plus: ^5.0.0
  web_socket_channel: ^3.0.3

  # Social Authentication
  google_sign_in: ^6.2.0
  flutter_facebook_auth: ^6.2.0
  
  # Share
  share_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/mtour_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/mtour_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/mtour_logo.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/mtour_logo.png

